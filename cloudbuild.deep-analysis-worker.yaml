# Cloud Run Job용 deep-analysis worker 이미지. 빌드 컨텍스트는 모노레포 루트다.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile.deep-analysis-worker'
      - '-t'
      - '${_TAG}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_TAG}']

timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _TAG: 'asia-northeast3-docker.pkg.dev/changupnote-com/cunote/deep-analysis-worker:latest'
